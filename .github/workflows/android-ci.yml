name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build PadelScore
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show build environment
        run: |
          java --version
          ./gradlew --version

      - name: Run unit tests
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :mobile:testDebugUnitTest \
            --stacktrace

      - name: Run release lint
        run: |
          ./gradlew \
            :app:lintRelease \
            :mobile:lintRelease \
            --stacktrace

      - name: Build unsigned release bundles
        run: |
          ./gradlew \
            :app:bundleRelease \
            :mobile:bundleRelease \
            --stacktrace

      - name: Verify release bundles
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build/outputs/bundle/release/app-release.aab
          test -f mobile/build/outputs/bundle/release/mobile-release.aab

          sha256sum \
            app/build/outputs/bundle/release/app-release.aab \
            mobile/build/outputs/bundle/release/mobile-release.aab

      - name: Upload Wear OS bundle
        uses: actions/upload-artifact@v7
        with:
          name: padelscore-wear-unsigned-ci
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload mobile companion bundle
        uses: actions/upload-artifact@v7
        with:
          name: padelscore-mobile-unsigned-ci
          path: mobile/build/outputs/bundle/release/mobile-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: padelscore-ci-failure-reports
          path: |
            app/build/reports
            mobile/build/reports
          if-no-files-found: ignore
          retention-days: 7