name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build PadelScore
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show build environment
        run: |
          java --version
          ./gradlew --version

      - name: Run unit tests
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :mobile:testDebugUnitTest \
            --stacktrace

      - name: Run release lint
        run: |
          ./gradlew \
            :app:lintRelease \
            :mobile:lintRelease \
            --stacktrace

      - name: Build unsigned release bundles
        run: |
          ./gradlew \
            :app:bundleRelease \
            :mobile:bundleRelease \
            --stacktrace

      - name: Verify release bundles
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build/outputs/bundle/release/app-release.aab
          test -f mobile/build/outputs/bundle/release/mobile-release.aab

          sha256sum \
            app/build/outputs/bundle/release/app-release.aab \
            mobile/build/outputs/bundle/release/mobile-release.aab

      - name: Upload Wear OS bundle
        uses: actions/upload-artifact@v7
        with:
          name: padelscore-wear-unsigned-ci
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload mobile companion bundle
        uses: actions/upload-artifact@v7
        with:
          name: padelscore-mobile-unsigned-ci
          path: mobile/build/outputs/bundle/release/mobile-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: padelscore-ci-failure-reports
          path: |
            app/build/reports
            mobile/build/reports
          if-no-files-found: ignore
          retention-days: 7
  signed-release-build:
    name: Build signed release bundles
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Reconstruct upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PADELSCORE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "PADELSCORE_UPLOAD_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          printf '%s' "${KEYSTORE_BASE64}" \
            | base64 --decode \
            > "${RUNNER_TEMP}/padelscore-upload.jks"

          test -s "${RUNNER_TEMP}/padelscore-upload.jks"
          chmod 600 "${RUNNER_TEMP}/padelscore-upload.jks"

      - name: Build signed release bundles
        env:
          PADELSCORE_UPLOAD_STORE_FILE: ${{ runner.temp }}/padelscore-upload.jks
          PADELSCORE_UPLOAD_STORE_PASSWORD: ${{ secrets.PADELSCORE_UPLOAD_STORE_PASSWORD }}
          PADELSCORE_UPLOAD_KEY_ALIAS: ${{ secrets.PADELSCORE_UPLOAD_KEY_ALIAS }}
          PADELSCORE_UPLOAD_KEY_PASSWORD: ${{ secrets.PADELSCORE_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :app:bundleRelease \
            :mobile:bundleRelease \
            --stacktrace

      - name: Verify signed bundles
        shell: bash
        run: |
          set -euo pipefail

          wear_bundle="app/build/outputs/bundle/release/app-release.aab"
          mobile_bundle="mobile/build/outputs/bundle/release/mobile-release.aab"

          test -s "${wear_bundle}"
          test -s "${mobile_bundle}"

          jarsigner -verify "${wear_bundle}"
          jarsigner -verify "${mobile_bundle}"

          sha256sum "${wear_bundle}" "${mobile_bundle}"

      - name: Upload signed Wear OS bundle
        uses: actions/upload-artifact@v7
        with:
          name: padelscore-wear-signed-release
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3

      - name: Upload signed mobile companion bundle
        uses: actions/upload-artifact@v7
        with:
          name: padelscore-mobile-signed-release
          path: mobile/build/outputs/bundle/release/mobile-release.aab
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary upload keystore
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/padelscore-upload.jks"
  play-api-access-check:
    name: Verify Google Play API access
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google authentication library
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install \
            --disable-pip-version-check \
            --quiet \
            google-auth

      - name: Verify Google Play API access
        shell: bash
        env:
          PACKAGE_NAME: ch.hygro.padelscore
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          import google.auth
          from google.auth.transport.requests import Request

          package_name = os.environ["PACKAGE_NAME"]
          scope = "https://www.googleapis.com/auth/androidpublisher"

          credentials, _ = google.auth.default(scopes=[scope])
          credentials.refresh(Request())

          access_token = credentials.token
          base_url = (
              "https://androidpublisher.googleapis.com/androidpublisher/v3/"
              f"applications/{package_name}/edits"
          )

          edit_id = None

          def api_request(method, url, body=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {access_token}",
                  "Accept": "application/json",
              }

              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  url=url,
                  data=data,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      response_body = response.read().decode("utf-8")

                      if not response_body:
                          return None

                      return json.loads(response_body)
              except urllib.error.HTTPError as error:
                  error_body = error.read().decode("utf-8", errors="replace")
                  print(
                      f"Google Play API request failed with HTTP {error.code}.",
                      file=sys.stderr,
                  )
                  print(error_body, file=sys.stderr)
                  raise

          try:
              created_edit = api_request("POST", base_url, {})
              edit_id = created_edit["id"]

              print("Google Play API authentication succeeded.")
              print("Access to ch.hygro.padelscore succeeded.")
              print("A temporary empty edit was created.")

              api_request(
                  "POST",
                  f"{base_url}/{edit_id}:validate",
                  {},
              )

              print("The temporary edit validated successfully.")
          finally:
              if edit_id:
                  api_request(
                      "DELETE",
                      f"{base_url}/{edit_id}",
                  )
                  print("The temporary edit was deleted.")

          print("No bundle was uploaded.")
          print("No edit was committed.")
          print("No release or track was changed.")
          PYTHON
