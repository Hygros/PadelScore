name: Publish Google Play closed tests

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_TEST to publish both closed-test releases
        required: true
        type: string
      release_name:
        description: Optional release label shown in Google Play
        required: false
        default: PadelScore automated test release
        type: string

permissions:
  contents: read

concurrency:
  group: padelscore-google-play-publishing
  cancel-in-progress: false

jobs:
  publish-closed-tests:
    name: Publish Wear OS and mobile closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PACKAGE_NAME: ch.hygro.padelscore
      WEAR_TRACK: wear:PadelScore Wear OS Test
      MOBILE_TRACK: PadelScore Companion Test

    steps:
      - name: Require explicit publishing confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [ "${CONFIRMATION}" != "PUBLISH_TEST" ]; then
            echo "Publishing was not confirmed."
            echo "Enter exactly PUBLISH_TEST when starting this workflow."
            exit 1
          fi

          echo "Closed-test publishing was explicitly confirmed."

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and release lint
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :mobile:testDebugUnitTest \
            :app:lintRelease \
            :mobile:lintRelease \
            --stacktrace

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google authentication library
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            --quiet \
            google-auth

      - name: Create edit and calculate version codes
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.request

          import google.auth
          from google.auth.transport.requests import Request

          package_name = os.environ["PACKAGE_NAME"]
          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          github_output = pathlib.Path(os.environ["GITHUB_OUTPUT"])

          scope = "https://www.googleapis.com/auth/androidpublisher"

          credentials, _ = google.auth.default(scopes=[scope])
          credentials.refresh(Request())

          access_token = credentials.token
          base_url = (
              "https://androidpublisher.googleapis.com/androidpublisher/v3/"
              f"applications/{package_name}/edits"
          )

          def api_request(method, url, body=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {access_token}",
                  "Accept": "application/json",
              }

              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  url=url,
                  data=data,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      response_body = response.read().decode("utf-8")

                      if not response_body:
                          return None

                      return json.loads(response_body)
              except urllib.error.HTTPError as error:
                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace",
                  )
                  print(
                      f"Google Play API request failed with HTTP {error.code}.",
                      file=sys.stderr,
                  )
                  print(error_body, file=sys.stderr)
                  raise

          created_edit = api_request("POST", base_url, {})
          edit_id = created_edit["id"]

          edit_file = runner_temp / "padelscore-play-edit-id"
          edit_file.write_text(edit_id, encoding="utf-8")

          bundles_response = api_request(
              "GET",
              f"{base_url}/{edit_id}/bundles",
          )

          bundles = bundles_response.get("bundles", [])

          existing_codes = [
              int(bundle["versionCode"])
              for bundle in bundles
              if "versionCode" in bundle
          ]

          highest_existing_code = max(existing_codes, default=0)
          wear_version_code = highest_existing_code + 1
          mobile_version_code = highest_existing_code + 2

          if wear_version_code == mobile_version_code:
              raise RuntimeError("Calculated version codes are not unique.")

          if wear_version_code <= highest_existing_code:
              raise RuntimeError("Wear version code is not increasing.")

          if mobile_version_code <= wear_version_code:
              raise RuntimeError(
                  "Mobile version code must be higher than the Wear code."
              )

          with github_output.open("a", encoding="utf-8") as output:
              output.write(f"edit_id={edit_id}\n")
              output.write(
                  f"highest_existing_code={highest_existing_code}\n"
              )
              output.write(
                  f"wear_version_code={wear_version_code}\n"
              )
              output.write(
                  f"mobile_version_code={mobile_version_code}\n"
              )

          print(
              "Highest existing Google Play version code: "
              f"{highest_existing_code}"
          )
          print(f"Calculated Wear OS version code: {wear_version_code}")
          print(f"Calculated mobile version code: {mobile_version_code}")
          print("A transactional Google Play edit was created.")
          print("No release has been committed yet.")
          PYTHON

      - name: Reconstruct upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PADELSCORE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "PADELSCORE_UPLOAD_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          printf '%s' "${KEYSTORE_BASE64}" \
            | base64 --decode \
            > "${RUNNER_TEMP}/padelscore-upload.jks"

          test -s "${RUNNER_TEMP}/padelscore-upload.jks"
          chmod 600 "${RUNNER_TEMP}/padelscore-upload.jks"

      - name: Build signed bundles with calculated version codes
        env:
          PADELSCORE_UPLOAD_STORE_FILE: ${{ runner.temp }}/padelscore-upload.jks
          PADELSCORE_UPLOAD_STORE_PASSWORD: ${{ secrets.PADELSCORE_UPLOAD_STORE_PASSWORD }}
          PADELSCORE_UPLOAD_KEY_ALIAS: ${{ secrets.PADELSCORE_UPLOAD_KEY_ALIAS }}
          PADELSCORE_UPLOAD_KEY_PASSWORD: ${{ secrets.PADELSCORE_UPLOAD_KEY_PASSWORD }}
          WEAR_VERSION_CODE: ${{ steps.versions.outputs.wear_version_code }}
          MOBILE_VERSION_CODE: ${{ steps.versions.outputs.mobile_version_code }}
        run: |
          set -euo pipefail

          ./gradlew \
            :app:bundleRelease \
            :mobile:bundleRelease \
            "-PpadelscoreWearVersionCode=${WEAR_VERSION_CODE}" \
            "-PpadelscoreMobileVersionCode=${MOBILE_VERSION_CODE}" \
            --stacktrace

      - name: Verify signed bundles
        shell: bash
        run: |
          set -euo pipefail

          wear_bundle="app/build/outputs/bundle/release/app-release.aab"
          mobile_bundle="mobile/build/outputs/bundle/release/mobile-release.aab"

          test -s "${wear_bundle}"
          test -s "${mobile_bundle}"

          jarsigner -verify "${wear_bundle}"
          jarsigner -verify "${mobile_bundle}"

          sha256sum "${wear_bundle}" "${mobile_bundle}"

      - name: Upload bundles and update closed-test tracks
        shell: bash
        env:
          EDIT_ID: ${{ steps.versions.outputs.edit_id }}
          EXPECTED_WEAR_VERSION_CODE: ${{ steps.versions.outputs.wear_version_code }}
          EXPECTED_MOBILE_VERSION_CODE: ${{ steps.versions.outputs.mobile_version_code }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          import google.auth
          from google.auth.transport.requests import Request

          package_name = os.environ["PACKAGE_NAME"]
          edit_id = os.environ["EDIT_ID"]
          wear_track = os.environ["WEAR_TRACK"]
          mobile_track = os.environ["MOBILE_TRACK"]

          expected_wear_code = int(
              os.environ["EXPECTED_WEAR_VERSION_CODE"]
          )
          expected_mobile_code = int(
              os.environ["EXPECTED_MOBILE_VERSION_CODE"]
          )

          release_name = os.environ.get(
              "RELEASE_NAME",
              "PadelScore automated test release",
          ).strip()

          if not release_name:
              release_name = "PadelScore automated test release"

          wear_bundle_path = pathlib.Path(
              "app/build/outputs/bundle/release/app-release.aab"
          )
          mobile_bundle_path = pathlib.Path(
              "mobile/build/outputs/bundle/release/mobile-release.aab"
          )

          scope = "https://www.googleapis.com/auth/androidpublisher"

          credentials, _ = google.auth.default(scopes=[scope])
          credentials.refresh(Request())

          access_token = credentials.token

          edit_base_url = (
              "https://androidpublisher.googleapis.com/"
              "androidpublisher/v3/applications/"
              f"{package_name}/edits/{edit_id}"
          )

          upload_base_url = (
              "https://androidpublisher.googleapis.com/upload/"
              "androidpublisher/v3/applications/"
              f"{package_name}/edits/{edit_id}/bundles"
          )

          def api_request(method, url, body=None):
              data = None
              headers = {
                  "Authorization": f"Bearer {access_token}",
                  "Accept": "application/json",
              }

              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  url=url,
                  data=data,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      response_body = response.read().decode("utf-8")

                      if not response_body:
                          return None

                      return json.loads(response_body)
              except urllib.error.HTTPError as error:
                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace",
                  )
                  print(
                      f"Google Play API request failed with HTTP {error.code}.",
                      file=sys.stderr,
                  )
                  print(error_body, file=sys.stderr)
                  raise

          def upload_bundle(bundle_path):
              bundle_data = bundle_path.read_bytes()

              request = urllib.request.Request(
                  url=upload_base_url,
                  data=bundle_data,
                  headers={
                      "Authorization": f"Bearer {access_token}",
                      "Accept": "application/json",
                      "Content-Type": "application/octet-stream",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(request, timeout=300) as response:
                      return json.loads(
                          response.read().decode("utf-8")
                      )
              except urllib.error.HTTPError as error:
                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace",
                  )
                  print(
                      f"Bundle upload failed with HTTP {error.code}.",
                      file=sys.stderr,
                  )
                  print(error_body, file=sys.stderr)
                  raise

          def update_track(track_id, version_code, label):
              encoded_track = urllib.parse.quote(
                  track_id,
                  safe="",
              )

              body = {
                  "track": track_id,
                  "releases": [
                      {
                          "name": f"{release_name} - {label}",
                          "versionCodes": [str(version_code)],
                          "status": "completed",
                      }
                  ],
              }

              return api_request(
                  "PUT",
                  f"{edit_base_url}/tracks/{encoded_track}",
                  body,
              )

          wear_upload = upload_bundle(wear_bundle_path)
          uploaded_wear_code = int(wear_upload["versionCode"])

          if uploaded_wear_code != expected_wear_code:
              raise RuntimeError(
                  "Uploaded Wear version code does not match "
                  f"the calculated value: {uploaded_wear_code} "
                  f"!= {expected_wear_code}"
              )

          print(
              f"Wear OS bundle uploaded with version code "
              f"{uploaded_wear_code}."
          )

          mobile_upload = upload_bundle(mobile_bundle_path)
          uploaded_mobile_code = int(mobile_upload["versionCode"])

          if uploaded_mobile_code != expected_mobile_code:
              raise RuntimeError(
                  "Uploaded mobile version code does not match "
                  f"the calculated value: {uploaded_mobile_code} "
                  f"!= {expected_mobile_code}"
              )

          print(
              f"Mobile bundle uploaded with version code "
              f"{uploaded_mobile_code}."
          )

          update_track(
              wear_track,
              uploaded_wear_code,
              "Wear OS",
          )

          print(f"Wear OS track prepared: {wear_track}")

          update_track(
              mobile_track,
              uploaded_mobile_code,
              "Mobile",
          )

          print(f"Mobile track prepared: {mobile_track}")

          api_request(
              "POST",
              f"{edit_base_url}:validate",
              {},
          )

          print("The combined Google Play edit validated successfully.")
          print("No edit has been committed yet.")
          PYTHON

      - name: Commit combined closed-test release
        shell: bash
        env:
          EDIT_ID: ${{ steps.versions.outputs.edit_id }}
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.request

          import google.auth
          from google.auth.transport.requests import Request

          package_name = os.environ["PACKAGE_NAME"]
          edit_id = os.environ["EDIT_ID"]
          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])

          scope = "https://www.googleapis.com/auth/androidpublisher"

          credentials, _ = google.auth.default(scopes=[scope])
          credentials.refresh(Request())

          access_token = credentials.token

          commit_url = (
              "https://androidpublisher.googleapis.com/"
              "androidpublisher/v3/applications/"
              f"{package_name}/edits/{edit_id}:commit"
          )

          request = urllib.request.Request(
              url=commit_url,
              data=b"{}",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  response.read()
          except urllib.error.HTTPError as error:
              error_body = error.read().decode(
                  "utf-8",
                  errors="replace",
              )
              print(
                  f"Google Play edit commit failed with HTTP {error.code}.",
                  file=sys.stderr,
              )
              print(error_body, file=sys.stderr)
              raise

          committed_marker = runner_temp / "padelscore-play-edit-committed"
          committed_marker.write_text("committed", encoding="utf-8")

          print("Google Play edit committed successfully.")
          print("Wear OS closed-test release was published.")
          print("Mobile closed-test release was published.")
          PYTHON

      - name: Upload published bundles as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: padelscore-published-test-bundles
          path: |
            app/build/outputs/bundle/release/app-release.aab
            mobile/build/outputs/bundle/release/mobile-release.aab
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/padelscore-upload.jks"

      - name: Delete uncommitted Google Play edit after failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          edit_file="${RUNNER_TEMP}/padelscore-play-edit-id"
          committed_file="${RUNNER_TEMP}/padelscore-play-edit-committed"

          if [ ! -f "${edit_file}" ]; then
            echo "No Google Play edit was created."
            exit 0
          fi

          if [ -f "${committed_file}" ]; then
            echo "The Google Play edit was committed successfully."
            exit 0
          fi

          export EDIT_ID
          EDIT_ID="$(cat "${edit_file}")"

          python3 - <<'PYTHON'
          import os
          import sys
          import urllib.error
          import urllib.request

          import google.auth
          from google.auth.transport.requests import Request

          package_name = os.environ["PACKAGE_NAME"]
          edit_id = os.environ["EDIT_ID"]

          scope = "https://www.googleapis.com/auth/androidpublisher"

          credentials, _ = google.auth.default(scopes=[scope])
          credentials.refresh(Request())

          delete_url = (
              "https://androidpublisher.googleapis.com/"
              "androidpublisher/v3/applications/"
              f"{package_name}/edits/{edit_id}"
          )

          request = urllib.request.Request(
              url=delete_url,
              headers={
                  "Authorization": f"Bearer {credentials.token}",
                  "Accept": "application/json",
              },
              method="DELETE",
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  response.read()

              print("The uncommitted Google Play edit was deleted.")
          except urllib.error.HTTPError as error:
              if error.code in (404, 409):
                  print(
                      "The edit was already unavailable and required "
                      "no further cleanup."
                  )
              else:
                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace",
                  )
                  print(
                      f"Edit cleanup failed with HTTP {error.code}.",
                      file=sys.stderr,
                  )
                  print(error_body, file=sys.stderr)
                  raise
          PYTHON